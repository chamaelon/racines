name: Déployer sur GitHub Pages

on:
  push:
    branches: [main, animations-contes]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Valider les données
        run: npm run validate
      - name: Tests unitaires
        run: npm test
      - name: Construire le site
        run: npm run build
      - name: Mettre à jour la navigation des films
        run: mkdir -p dist/site/commun && cp animations/site/commun/app.js dist/site/commun/app.js
      # La branche gh-pages garde aussi les films et le studio (dossiers site/, histoires/, lib/…) :
      # ils ne sont pas dans ce dépôt, d'où keep_files.
      - name: Publier
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: true
          commit_message: Publication de la plateforme Racines
