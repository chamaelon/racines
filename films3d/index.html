<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Banc de montage des films 3D</title>
<style>
  body { margin: 0; background: #111; color: #eee; font: 14px sans-serif; }
  canvas { display: block; width: 100%; max-height: 88vh; aspect-ratio: 16 / 9; }
  .barre { display: flex; gap: 10px; align-items: center; padding: 8px 12px; }
  input[type=range] { flex: 1; }
  body.rendu { background: #000; }
  body.rendu .barre { display: none; }
</style>
</head>
<body>
<canvas id="film"></canvas>
<div class="barre">
  <button id="lire" type="button">Lire</button>
  <input id="temps" type="range" min="0" step="0.04" value="0">
  <output id="repere">0:00.0</output>
</div>
<script type="module" src="./banc.js"></script>
</body>
</html>
